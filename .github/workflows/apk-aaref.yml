name: Build Aaref APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/apk-aaref.yml', 'android-app-aaref/**']
permissions:
  contents: write
concurrency:
  group: apk-aaref
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-aaref-v1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir www && echo '<html><body>Loading...</body></html>' > www/index.html
          npx cap init "اعرف شخصيتك" com.aaref.app --web-dir www
          cat > capacitor.config.json <<JSON
          {"appId":"com.aaref.app","appName":"اعرف شخصيتك","webDir":"www","server":{"url":"https://aaref.vercel.app","cleartext":false},"backgroundColor":"#150d26"}
          JSON
          npx cap add android
          F=$(find android -name MainActivity.java 2>/dev/null | head -1)
          [ -z "$F" ] && { F=android/app/src/main/java/com/aaref/app/MainActivity.java; mkdir -p $(dirname $F); }
          cp ../android-app-aaref/MainActivity.java "$F"
          sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application|' android/app/src/main/AndroidManifest.xml
          R=android/app/src/main/res
          mkdir -p $R/drawable $R/mipmap-anydpi-v26 $R/values
          cat > $R/drawable/aaref_bg.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M0,0h108v108h-108z">
              <aapt:attr name="android:fillColor">
                <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:startColor="#2a1252" android:endColor="#7a1f64" android:type="linear" />
              </aapt:attr>
            </path>
          </vector>
          XML
          cat > $R/drawable/aaref_fg.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" xmlns:aapt="http://schemas.android.com/aapt" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#3b1d6e" android:pathData="M38,74 L70,74 L74,82 L34,82 Z" />
            <path android:fillColor="#a855f7" android:pathData="M36,80 L72,80 L72,83 L36,83 Z" />
            <path android:pathData="M54,27 a23,23 0 1,0 0.01,0 z">
              <aapt:attr name="android:fillColor">
                <gradient android:centerX="46" android:centerY="42" android:gradientRadius="34" android:startColor="#ffffff" android:centerColor="#d8b4fe" android:endColor="#9333ea" android:type="radial" />
              </aapt:attr>
            </path>
            <path android:fillColor="#ffffffcc" android:pathData="M34,36 a8,5 0 1,0 16,0 a8,5 0 1,0 -16,0 z" />
            <path android:fillColor="#fbcfe8" android:pathData="M64,40 L66,45 L71,47 L66,49 L64,54 L62,49 L57,47 L62,45 Z" />
            <path android:fillColor="#ffffff" android:pathData="M50,52 L51.3,55.5 L55,57 L51.3,58.5 L50,62 L48.7,58.5 L45,57 L48.7,55.5 Z" />
          </vector>
          XML
          for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/aaref_bg" />
            <foreground android:drawable="@drawable/aaref_fg" />
          </adaptive-icon>
          XML
          done
          printf '\ndependencies {\n  implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))\n}\n' >> android/app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/' android/app/build.gradle
          grep -n versionCode android/app/build.gradle
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk aaref.apk
          gh release delete aaref -y --cleanup-tag || true
          gh release create aaref aaref.apk --title "v${{ github.run_number }}" --notes "Android app (debug-signed)."
